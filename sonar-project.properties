# SonarCloud configuration for CI-based analysis.
#
# Automatic Analysis is switched off for this project: it cannot import test
# coverage. The scan is run from .github/workflows/ci.yml, after pytest has
# written coverage.xml.

sonar.projectKey=SuryaKiran434_drive-sync
sonar.organization=suryakiran434

# The application is a single top-level module; everything under tests/ is
# test code, including the conftest and the fake Drive API used by the suite.
sonar.sources=drive_sync.py
sonar.tests=tests

# pytest is invoked with --cov=drive_sync --cov-report=xml, which writes
# coverage.xml to the repository root.
sonar.python.coverage.reportPaths=coverage.xml

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
