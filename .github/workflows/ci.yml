name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Every job in this workflow only reads the
# repository -- checkout, dependency install, lint/test and artifact upload all
# work fine with `contents: read`. A job that ever needs to write (push a commit,
# comment on a PR, cut a release) must request that scope on itself rather than
# widening this block.
permissions:
  contents: read

jobs:
  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud needs the full history to attribute code to authors and
          # to work out what counts as "new code"; a shallow clone breaks both.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test-only, pinned in its own manifest so Dependabot can see the
          # versions; requirements.txt stays the pinned runtime set.
          pip install -r requirements-ci.txt

      # The suite is fully mocked — no network, no credentials, no
      # credentials.json or token.json required.
      #
      # drive_sync.py is the whole application — a single top-level module —
      # so it is the only coverage target.
      - name: Run pytest
        run: |
          python -m pytest -q \
            --cov=drive_sync --cov-report=xml --cov-report=term

      - name: Coverage summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print("## Coverage")
          print()
          print(f"**{rate * 100:.2f}%** of statements in `drive_sync.py` covered.")
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

      # Runs after pytest so coverage.xml already exists. Configuration lives in
      # sonar-project.properties at the repo root.
      #
      # Analysis is advisory, not a gate: continue-on-error keeps a SonarCloud
      # outage or a scanner hiccup from failing the required check.
      - name: SonarCloud analysis
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
