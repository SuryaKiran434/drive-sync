name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test-only; requirements.txt stays the pinned runtime set.
          pip install pytest pytest-cov

      # The suite is fully mocked — no network, no credentials, no
      # credentials.json or token.json required.
      #
      # drive_sync.py is the whole application — a single top-level module —
      # so it is the only coverage target.
      - name: Run pytest
        run: |
          python -m pytest -q \
            --cov=drive_sync --cov-report=xml --cov-report=term

      - name: Coverage summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print("## Coverage")
          print()
          print(f"**{rate * 100:.2f}%** of statements in `drive_sync.py` covered.")
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
