name: Slack Push Notification

on:
  push:
    branches:
      - '**'

# Least privilege for GITHUB_TOKEN. This workflow only reads push metadata from
# the event payload and POSTs to a webhook -- it never writes to the repository.
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Commit metadata comes in through the env, never inline `${{ }}` in
          # the run script — backticks or $(...) in a commit message would
          # otherwise execute on the runner.
          # securitylab.github.com/research/github-actions-untrusted-input/
          REPO:       ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH:     ${{ github.ref_name }}
          AUTHOR:     ${{ github.event.head_commit.author.name }}
          SHA:        ${{ github.sha }}
          RUN_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set for this repository — skipping."
            echo "Add it with: gh secret set SLACK_WEBHOOK_URL --repo $REPO"
            exit 0
          fi

          if [ "$BRANCH" = "main" ]; then COLOR="#36a64f"; else COLOR="#f0a500"; fi

          # jq builds the payload so quotes, backslashes and newlines in a
          # commit message can't produce malformed JSON.
          PAYLOAD=$(jq -n \
            --arg repo    "${REPO##*/}" \
            --arg branch  "$BRANCH" \
            --arg author  "$AUTHOR" \
            --arg message "$COMMIT_MSG" \
            --arg color   "$COLOR" \
            --arg sha     "${SHA:0:7}" \
            --arg run_url "$RUN_URL" \
            '{
              username:   "GitHub Bot",
              icon_emoji: ":rocket:",
              text:       ("🚀 *New push to " + $repo + "* — `" + $branch + "`"),
              attachments: [
                {
                  color: $color,
                  fields: [
                    { title: "🌿 Branch",  value: ("`" + $branch + "`"), short: true  },
                    { title: "👤 Author",  value: $author,               short: true  },
                    { title: "🔖 Commit",  value: ("`" + $sha + "`"),    short: true  },
                    { title: "⚙️ Run",     value: $run_url,              short: true  },
                    { title: "💬 Message", value: $message,              short: false }
                  ]
                }
              ]
            }')

          curl -sS --fail-with-body -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
