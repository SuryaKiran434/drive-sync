name: Dependabot auto-merge

# Queues Dependabot's routine updates to merge themselves once the required
# checks on main go green, so patch and minor bumps stop accumulating in the
# review queue.
#
# "Auto-merge" means *queue* the merge -- GitHub performs it only when every
# required check passes. A red check leaves the PR open exactly as it would
# without this workflow; nothing here can merge past a failing build.
#
# Majors are deliberately excluded, because they are the updates that can
# require a code change on our side. .github/dependabot.yml already suppresses
# routine library majors, so in practice the ones that reach here are GitHub
# Actions majors and major-version security advisories -- both worth a look.

on: pull_request

# Workflows triggered by Dependabot get a read-only GITHUB_TOKEN by default;
# these two scopes are what allow this job to enable auto-merge. Note it never
# checks out or executes the PR's code -- it only reads metadata and calls the
# API -- so the elevated scopes are not reachable from an untrusted branch.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # For a grouped PR, update-type is the HIGHEST bump in the batch, so a
      # single major holds the whole PR back rather than riding along unseen.
      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
